# v1.1.49: PR 自动检查 — 后端编译 + PC 端构建 + App H5 构建
# 跑 mvn compile 确保 SecurityPreflightValidator 等新增代码没编译错
# 跑 npm run build:h5 确保前端没语法错误
# 注意: 不跑 Testcontainers 集成测试 (需 Docker), 只跑 mvn compile

name: ci-build-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 关键: 默认 shell 是 `bash -e {0}` (没有 pipefail), 于是 `mvn ... | tail -40` 的退出码
# 取自 tail —— mvn 挂了 job 照样绿, 测试/编译/构建这道门禁形同虚设。
# `shell: bash` 会展开成 `bash --noprofile --norc -eo pipefail {0}`, 管道里任一环失败即失败。
# 下面各步另外改成「写日志文件 + tail 日志」的写法, 不依赖管道退出码语义, 双保险。
defaults:
  run:
    shell: bash

jobs:
  version-consistency:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version across publish sources
        run: bash scripts/check-version.sh

  backend-compile:
    name: Backend compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Compile backend
        run: |
          cd backend
          # 用本地 mvn (GitHub Actions runner 预装 maven)
          # `|| rc=$?` 让失败不中断脚本, 便于把日志尾部打出来再带着原退出码结束
          rc=0
          mvn -B compile -DskipTests > /tmp/mvn-compile.log 2>&1 || rc=$?
          tail -20 /tmp/mvn-compile.log
          exit $rc
        timeout-minutes: 10

  # v1.1.104+: 跑单元测试 (14 个测试类覆盖), 挡掉 PR 上的回归 (如 MyBatis-Plus FieldFill 漏写 / SysBackupController 死注解类教训)
  #   注意: 跳过 Testcontainers 集成测试 (*IT.java 需 Docker), 只跑 *Test.java 单元测试
  backend-test:
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Run unit tests (skip Testcontainers integration tests)
        run: |
          cd backend
          rc=0
          mvn -B test -Dtest='!Integration*Test,!*IT' -Dsurefire.failIfNoSpecifiedTests=false > /tmp/mvn-test.log 2>&1 || rc=$?
          tail -40 /tmp/mvn-test.log
          # 额外把 "Tests run" 汇总行打出来, 方便在 Actions 日志里直接看通过数
          grep -E 'Tests run:.*Failures' /tmp/mvn-test.log | tail -5 || true
          exit $rc
        timeout-minutes: 12

  # v1.1.104: scripts/check-perm.py 检查 controller method 防护.
  #   经过 v1.1.104 历史 perm 补全 (PrdOrderController 8 method + FeiePrintController.previewBill + ...) 后
  #   全量零 leak. 启用 --strict 模式: 有 leak 时 exit 1, 挡 PR
  check-perm:
    name: Check Controller perm coverage (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run check-perm.py --strict
        run: python3 scripts/check-perm.py --strict

  pc-web-build:
    name: PC Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pc-web deps
        run: |
          cd pc-web
          rc=0
          npm ci --no-audit --no-fund > /tmp/npm-ci-pc.log 2>&1 || rc=$?
          tail -5 /tmp/npm-ci-pc.log
          exit $rc
      - name: Build pc-web
        run: |
          cd pc-web
          rc=0
          npm run build > /tmp/npm-build-pc.log 2>&1 || rc=$?
          tail -10 /tmp/npm-build-pc.log
          exit $rc

  app-h5-build:
    name: App H5 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install app deps
        run: |
          cd app
          rc=0
          npm ci --no-audit --no-fund > /tmp/npm-ci-app.log 2>&1 || rc=$?
          tail -5 /tmp/npm-ci-app.log
          exit $rc
      - name: Build app H5
        run: |
          cd app
          rc=0
          npm run build:h5 > /tmp/npm-build-app.log 2>&1 || rc=$?
          tail -10 /tmp/npm-build-app.log
          exit $rc
      - name: Verify warningItems in dashboard chunk
        run: |
          JS=$(find app/dist/build/h5/assets -name "pages-dashboard-index.*.js")
          grep -q "warningList" "$JS" || (echo "Dashboard chunk missing warningList"; exit 1)
