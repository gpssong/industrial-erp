version: '3.8'

# =============================================================
# 飞牛 NAS 热备 docker-compose 配置
# 部署路径: 飞牛 NAS /volume2/erp-system/
# 启动: docker compose -f docker-compose.failover.yml up -d
# 停止: docker compose -f docker-compose.failover.yml down
# =============================================================

services:
  # -------------------------------------------------------------
  # MySQL 8.0 (热备从库, 实时同步主库 binlog)
  # -------------------------------------------------------------
  erp-mysql-failover:
    image: mysql:8.0
    container_name: erp-mysql-failover
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: erp_root_pwd
      SPRING_DATASOURCE_PASSWORD: erp_root_pwd
      TZ: Asia/Shanghai
    volumes:
      # 数据目录 (bind mount, 与主库同步)
      - /volume2/erp-system/mysql-data:/var/lib/mysql
      # 启动初始化脚本 (自动 CHANGE MASTER TO)
      - ./init-mysql-replica.sh:/docker-entrypoint-initdb.d/01-init-replica.sh
    command:
      - --server-id=2
      - --log-bin=mysql-bin
      - --relay-log=relay-bin
      - --read-only=ON
      - --skip-slave-start=ON
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-perp_root_pwd"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp-failover-net

  # -------------------------------------------------------------
  # Redis 7 (热备, 主库 AOF 流式同步)
  # -------------------------------------------------------------
  redis-failover:
    image: redis:7-alpine
    container_name: redis-failover
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - /volume2/erp-system/redis-data:/data
    command: redis-server --appendonly yes --replicaof erp-redis-master 192.168.0.150 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp-failover-net

  # -------------------------------------------------------------
  # Backend (Spring Boot) - 默认 standby, 故障时由 failover.sh 启动
  # -------------------------------------------------------------
  erp-backend-failover:
    image: erp-system-backend:latest
    container_name: erp-backend-failover
    profiles: ["failover"]  # 只在故障切换时启动
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_HOST: erp-mysql-failover
      SPRING_DATASOURCE_PORT: 3306
      SPRING_DATASOURCE_DB: industrial_erp
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: erp_root_pwd
      SPRING_DATA_REDIS_HOST: redis-failover
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_PROFILES_ACTIVE: prod
      ERP_BACKUP_PATH: /opt/industrial-erp/backup
      ERP_UPLOAD_PATH: /opt/industrial-erp/upload
      ERP_CORS_ALLOWED_ORIGINS: http://n150.93gushi.com:8088,http://home.93gushi.com:8088
      TZ: Asia/Shanghai
    volumes:
      - /volume2/erp-system/upload:/opt/industrial-erp/upload
      - /volume2/erp-system/backup:/opt/industrial-erp/backup
    depends_on:
      erp-mysql-failover:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/auth/captcha || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - erp-failover-net

  # -------------------------------------------------------------
  # PC Web (Nginx) - 前端静态资源
  # -------------------------------------------------------------
  erp-pc-web-failover:
    image: nginx:alpine
    container_name: erp-pc-web-failover
    profiles: ["failover"]
    restart: unless-stopped
    ports:
      - "18080:80"
    volumes:
      - /volume2/erp-system/pc-web/dist:/usr/share/nginx/html:ro
    depends_on:
      - erp-backend-failover
    networks:
      - erp-failover-net

  # -------------------------------------------------------------
  # Prometheus + Grafana 监控
  # -------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: erp-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - erp-failover-net

  grafana:
    image: grafana/grafana:latest
    container_name: erp-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: grafana_admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - erp-failover-net

  # -------------------------------------------------------------
  # Alertmanager + 微信 webhook
  # -------------------------------------------------------------
  alertmanager:
    image: prom/alertmanager:latest
    container_name: erp-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - erp-failover-net

  # -------------------------------------------------------------
  # 自动故障检测器 (主站心跳监测)
  # -------------------------------------------------------------
  failover-watcher:
    image: alpine:3.18
    container_name: erp-failover-watcher
    restart: unless-stopped
    volumes:
      - ./failover.sh:/vol2/erp-system/failover.sh:ro
      - ./wecom-config.json:/vol2/erp-system/wecom-config.json:ro
    working_dir: /vol2/erp-system
    # alpine 内置 /bin/sh + 周期性 wget 检查
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          RESULT=$$(wget -q -O - --timeout=10 "$${MAIN_URL:-https://home.93gushi.com:8088/api/auth/captcha}" > /dev/null 2>&1; echo $$?)
          echo "$$(date -Iseconds) main-site-check: $$RESULT"
          sleep 60
        done
    environment:
      - MAIN_URL=http://192.168.0.150:8088/api/auth/captcha
    networks:
      - erp-failover-net

networks:
  erp-failover-net:
    driver: bridge
    name: erp-failover-net

volumes:
  prometheus-data:
  grafana-data:
