# =============================================================
# Prometheus 监控配置 (飞牛 NAS)
# 位置: /volume2/erp-system/prometheus.yml
# 作用: 监控 MySQL 主从延迟、容器健康、磁盘空间、网络
# =============================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'erp-failover'
    region: 'fnos'

# 告警配置
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# 告警规则 (ErpFailover 命名空间)
rule_files:
  - "/etc/prometheus/rules/*.yml"

# 抓取配置
scrape_configs:
  # Prometheus 自身
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # MySQL 主库 (主 NAS)
  - job_name: 'mysql-master'
    static_configs:
      - targets: ['192.168.0.150:9104']  # mysqld_exporter
    metrics_path: /metrics

  # MySQL 从库 (飞牛 NAS)
  - job_name: 'mysql-replica'
    static_configs:
      - targets: ['mysql-failover:9104']
    metrics_path: /metrics

  # Redis
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-failover-exporter:9121']
    metrics_path: /metrics

  # Backend Spring Boot
  - job_name: 'erp-backend'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['erp-backend-failover:8080']

  # 容器健康
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # 黑盒监控: 探测主站 health
  - job_name: 'main-site-health'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
        - https://home.93gushi.com:8088/api/auth/captcha
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # 飞牛 NAS 自身
  - job_name: 'fnos-node'
    static_configs:
      - targets: ['localhost:9100']
