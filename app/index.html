<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1e6091">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="鹏程ERP">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="工业 ERP 移动端">

  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">

  <title>鹏程ERP</title>
  <link rel="stylesheet" href="/static/index.css">
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
  <script>
    // 注册 Service Worker (PWA) — 仅浏览器 H5。
    // v1.1.107: 加原生容器守卫。sw.js 是 PWA 离线缓存, 只给浏览器 H5 用;
    //   Capacitor APK 的 WebView (file://localhost, 无 http origin) 里 navigator.serviceWorker.register
    //   拿不到 /static/sw.js, 会常驻报 "Failed to register" / 404。
    //   R19: window.Capacitor 是"是不是原生容器"的权威判定 (APK 里必有, 浏览器 H5 里必无),
    //   直接内联判断, 无需 import (index.html 是纯静态, 引不了 js 模块)。
    if ('serviceWorker' in navigator && !window.Capacitor) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/static/sw.js').catch((err) => {
          console.warn('SW 注册失败:', err);
        });
      });
    }
  </script>
</body>
</html>
