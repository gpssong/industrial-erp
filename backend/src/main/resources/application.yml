server:
  port: 8080
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      force: true
      enabled: true

spring:
  application:
    name: industrial-erp
  # 默认 dev profile. 生产用 SPRING_PROFILES_ACTIVE=prod 切换 (docker-compose.yml 已设).
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  mvc:
    servlet:
      encoding:
        charset: UTF-8
        force: true
        enabled: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${SPRING_DATASOURCE_HOST:127.0.0.1}:${SPRING_DATASOURCE_PORT:3306}/${SPRING_DATASOURCE_DB:industrial_erp}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 3
      idle-timeout: 300000
      max-lifetime: 600000
      keepalive-time: 60000
      connection-timeout: 5000
      connection-test-query: "SELECT 1"
      leak-detection-threshold: 10000
      pool-name: erp-hikari
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      database: ${SPRING_DATA_REDIS_DATABASE:0}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 5000
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
  freemarker:
    template-loader-path: classpath:/templates
    suffix: .ftl
    charset: UTF-8
  task:
    scheduling:
      pool:
        core-size: 4

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.industrial.erp.modules.*.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      update-strategy: not_null

sa-token:
  # v1.1.46: 禁用 Sa-Token 内置 CORS 检查 (返回 "Invalid CORS request")
  # 改用 Spring MVC 的 CorsFilter + nginx 层处理
  is-check-cors: false
  token-name: Authorization
  timeout: 2592000
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-read-header: true
  is-read-cookie: true
  is-write-cookie: true
  is-read-query: false
  jwt-secret-key: ${SA_TOKEN_JWT_SECRET_KEY:?SA_TOKEN_JWT_SECRET_KEY_must_be_set_64+_chars_random_Generate_with_openssl_rand_hex_32}
  cookie:
    http-only: true
    secure: false
    same-site: Lax
    path: /

erp:
  version: ${ERP_VERSION:1.1.77}
  # v1.1.75 AI 集成第一步 — 通用 LLM 网关 (OpenAI 兼容协议, 支持通义/DeepSeek/OpenAI/OpenRouter).
  # key 为空时 AI 端点快速失败并提示"未配置", 不影响其他功能. 密钥只走 env, 不进 git.
  #
  # v1.1.77 AI Failover — provider 链 + cooldown + thinking strip.
  #   - 仅配 legacy 4 env (api-key/model/base-url/timeout-ms): 单 provider (default), 与 v1.1.75 行为一致.
  #   - 配 providers 逗号串 + 各 slot env: 启用按顺序的 failover 链, key 空 slot 自动跳过.
  #   - 触发 failover: 5xx / 408 / Hutool HttpException (超时/网络) / 429 quota + 429 通用.
  #   - 不触发: 401/403/400/业务错误 (choices 空/JSON 坏), 直接抛 BizException.
  #   - cooldown: 短 5min (5xx/timeout), 长 30min (429 quota). 冷却期间直接跳过该 provider.
  ai:
    # ---- legacy 单 provider (向后兼容 v1.1.75) ----
    api-key: ${ERP_AI_API_KEY:}
    model: ${ERP_AI_MODEL:qwen-plus}
    base-url: ${ERP_AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    timeout-ms: ${ERP_AI_TIMEOUT_MS:60000}
    # ---- v1.1.77 failover ----
    cooldown-ms: ${ERP_AI_FAILOVER_COOLDOWN_MS:300000}
    cooldown-long-ms: ${ERP_AI_FAILOVER_COOLDOWN_LONG_MS:1800000}
    strip-thinking: ${ERP_AI_STRIP_THINKING:true}
    providers: ${ERP_AI_PROVIDERS:}
    # provider slot 0 (主, 默认 agnes)
    provider0-name: ${ERP_AI_PROVIDER0_NAME:agnes}
    provider0-key: ${ERP_AI_PROVIDER0_KEY:${ERP_AI_API_KEY:}}
    provider0-model: ${ERP_AI_PROVIDER0_MODEL:${ERP_AI_MODEL:qwen-plus}}
    provider0-base-url: ${ERP_AI_PROVIDER0_BASE_URL:${ERP_AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}}
    provider0-timeout-ms: ${ERP_AI_PROVIDER0_TIMEOUT_MS:${ERP_AI_TIMEOUT_MS:60000}}
    provider0-strip-thinking: ${ERP_AI_PROVIDER0_STRIP_THINKING:false}
    # provider slot 1 (备, 默认 minimax)
    provider1-name: ${ERP_AI_PROVIDER1_NAME:minimax}
    provider1-key: ${ERP_AI_PROVIDER1_KEY:}
    provider1-model: ${ERP_AI_PROVIDER1_MODEL:MiniMax-M3}
    provider1-base-url: ${ERP_AI_PROVIDER1_BASE_URL:https://api.minimaxi.com/v1}
    provider1-timeout-ms: ${ERP_AI_PROVIDER1_TIMEOUT_MS:60000}
    provider1-strip-thinking: ${ERP_AI_PROVIDER1_STRIP_THINKING:true}
    # v1.1.75 任务3: RAG 语料目录 (读 *.md/*.txt 切块检索). 空则 RAG 不启用, 不影响其它 AI.
    # 容器部署时指向 jar 能读到的语料目录 (见部署说明).
    rag:
      corpus-dir: ${ERP_RAG_CORPUS_DIR:}
  upload:
    path: ${ERP_UPLOAD_PATH:/opt/industrial-erp/upload}
  cors:
    allowed-origins: ${ERP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:8080,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:8080}
  backup:
    path: ${ERP_BACKUP_PATH:${user.home}/erp-backup}
    sql-path: ${ERP_BACKUP_SQL_PATH:./sql}
    mysqldump-path: ${ERP_MYSQLDUMP:mysqldump}
    mysql-path: ${ERP_MYSQL:mysql}
    db-host: ${ERP_DB_HOST:mysql}
    db-port: ${ERP_DB_PORT:3306}
    retention-days: ${ERP_BACKUP_RETENTION_DAYS:30}

# ============ 默认 (dev) 配置 ============
logging:
  level:
    root: INFO
    com.industrial.erp: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
