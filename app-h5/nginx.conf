server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # v1.1.12+: 防止浏览器/WebView 缓存 SPA HTML + JS, 升级后用户拿旧 JS
    # (类似 PC web 之前遇到的"取消权限后又勾上"现象)
    # index.html: no-cache, 但文件名带 hash 的 assets 长期缓存 (1y)
    location ~* \.(?:html)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
    # 上传件回读 — ^~ 防止被上面的图片静态正则抢走 (后端 context-path=/api)
    location ^~ /api/upload/ {
        proxy_pass http://172.18.0.4:8080/api/upload/;
        # $http_host 保留端口: 后端按请求 Host 拼绝对地址 (App 原生 <image :src> 需要)
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
    }
    location /api/ {
        proxy_pass http://172.18.0.4:8080/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
