# 2026-11-16 入口层加固: 优雅停机最多等 10s, 不再无限等待泄漏的半关闭连接。
# ⚠️ worker_shutdown_timeout 只允许 main 上下文; 本文件被 include 进 http 块,
#    写在这里会 [emerg] -> 容器崩溃循环 (已实测)。所以由 compose 的 command
#    用 -g 注入: ["nginx", "-g", "daemon off; worker_shutdown_timeout 10s;"]
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # backend 容器停止时 Docker DNS 名会消失, 静态 proxy_pass 在启动即解析 -> emerg 崩溃循环。
    # 用 resolver + 变量把解析推迟到请求期: backend 不在时返回 502, nginx 自身照常启动。
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $erp_backend backend;

    # 安全加固 (P1-6): 关闭 server_tokens, 阻止响应头泄露 nginx 版本
    server_tokens off;

    # 访问日志落 bind-mount 的宿主文件, 不再写 stdout。
    # 之前 access_log 指向 /dev/stdout, docker 日志管道一旦停止排空, worker 写日志就阻塞,
    # 请求处理不完 -> 站点假死。error_log 仍走 stderr (错误日志量小, 且要能 docker logs 看到)。
    access_log /var/log/nginx/access.log;
    error_log /dev/stderr warn;

    # gzip
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml font/ttf font/otf application/wasm;
    gzip_vary on;
    gzip_proxied expired no-cache no-store private auth;

    # 全局安全 headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    # CSP 默认 'self'; myprint-design / vue 内联样式单独加 'unsafe-inline' 兼容 (生产可改 nonce)
    # 注意: 'unsafe-inline' 会削弱 XSS 防护; 如果未来 CSP 收紧, 需将内联样式迁到外部 CSS
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http: https: ws: wss:; frame-ancestors 'self'" always;

    # SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 始终不缓存, 让浏览器每次拿最新入口 (解决 Vite 构建后老 bundle 缓存问题)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "Thu, 01 Jan 1970 00:00:00 GMT";
        add_header Vary "Accept-Encoding" always;
    }

    # 静态资源 (带 hash 文件名) 永久缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # 上传件回读 (证照扫描件 / 检测报告 / 现场照片) — 后端 context-path=/api, 资源映射 /upload/**
    # ^~ 必须有: 否则被下面 \{js|css|png...\}$ 的正则 location 抢走, 变成找本地文件 404
    location ^~ /api/upload/ {
        proxy_pass http://$erp_backend:8080$request_uri;
        # $http_host 保留端口 (App 原生 <image :src> 要绝对地址, 后端按请求 Host 拼 URL;
        # 用 $host 会丢 :8088 端口, 拼出 http://ip/api/... 打不通)
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        expires 7d;
    }

    # AI 长调用 (agent 最多 6 轮 LLM, 最坏 180s) - v1.1.79 supplier fix 加
    # 比 /api/ 通用 60s 大, 否则前端 axios 还没报 180s 超时, nginx 先断
    location /api/ai/ {
        proxy_pass http://$erp_backend:8080$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        client_max_body_size 100M;
    }

    # 接口反代
    location /api/ {
        proxy_pass http://$erp_backend:8080$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        client_max_body_size 100M;
    }
}
